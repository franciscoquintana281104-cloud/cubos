    const antes = pag.p;
    pag.p += (p - pag.p) * (1 - Math.exp(-dt * 40));
    pag.v = pag.v * .3 + ((pag.p - antes) / dt) * .7;
    pintarPaginas();
  } else if (pag.asomo != null) {
    // Un cubo empuja contra el borde: la página de al lado asoma un poco
    pag.p += (pag.objetivo + pag.asomo - pag.p) * (1 - Math.exp(-dt * 14));
    pag.v = 0; pag.asomo = null;
    pintarPaginas();
  } else if (!pag.arr && Math.abs(pag.p - pag.objetivo) > .0005 || Math.abs(pag.v) > .002) {
    const k = 210, c = 2 * Math.sqrt(k) * .78;
    pag.v += (-k * (pag.p - pag.objetivo) - c * pag.v) * dt;
    pag.p += pag.v * dt;
    pintarPaginas();
  } else if (pag.p !== pag.objetivo) { pag.p = pag.objetivo; pag.v = 0; pintarPaginas(); }
}
let tAnterior = 0;
(function fisica(t) {
  pasoFisica(Math.min(.034, Math.max(.001, (t - (tAnterior || t)) / 1000))); tAnterior = t;
  requestAnimationFrame(fisica);
})();

// iPhone instalado como app: con la barra de estado translúcida, el alto que da el sistema no
// incluye esa franja y abajo quedaba un hueco blanco. Se fuerza el alto de la pantalla entera.
// iPhone instalado como app: el sistema da a la página la altura sin la franja de la barra de
// estado, y lo que va "fijado" a la pantalla no puede pasar de ahí; abajo quedaba un recuadro y la
// barbilla cortada. El objeto pasa a ir colocado normal y se estira a la pantalla entera.
function altoCompleto() {
  const objeto = document.getElementById("objeto"), raiz = document.documentElement;
  const instalada = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (!instalada) { objeto.style.cssText = ""; raiz.style.height = document.body.style.height = ""; return; }
  const alto = Math.max(innerHeight, screen.height, document.documentElement.clientHeight) + "px";
  raiz.style.height = document.body.style.height = alto;
  Object.assign(objeto.style, { position: "absolute", top: "0", left: "0", right: "0", bottom: "auto", height: alto });
}
altoCompleto();
addEventListener("orientationchange", () => setTimeout(() => { altoCompleto(); medir(); }, 300));

function medir() {
  // Con el teclado abierto no se recoloca nada (el iPhone cambia el alto al escribir)
  if (document.activeElement?.matches?.("input, textarea")) return;
  const objeto = document.getElementById("objeto"), est = getComputedStyle(objeto);
  const ancho = objeto.clientWidth, alto = objeto.clientHeight - parseFloat(est.paddingTop) - parseFloat(est.paddingBottom);
  if (ancho < 50 || alto < 50) return;   // aún sin tamaño (pestaña oculta): ya llegará un resize
  const reborde = Math.max(7, ancho * .022), hueco = 8;
  const anchoUtil = ancho - 2 * reborde - hueco, altoUtil = alto - 2 * reborde - hueco;
  FILAS = Math.max(8, Math.round(altoUtil / (anchoUtil / COLS)));
  celda = Math.min(anchoUtil / COLS, altoUtil / FILAS);
  Object.assign(tablero.style, { width: COLS * celda + "px", height: FILAS * celda + "px" });
  tablero.style.setProperty("--u", celda + "px");
  bandeja.style.setProperty("--u", celda + "px");
  // Una página con posiciones que ya no caben o se pisan vuelve a su sitio (solo esa)
  PAGINAS.forEach((p, i) => {
    const suyos = bloques.filter(b => b.pag === i);
    if (suyos.every(b => libre(b, b.x, b.y))) return;
    // Se recolocan los de serie en su sitio y los demás en el primer hueco que quepan
    suyos.forEach(b => { b.x = -99; });
    suyos.forEach(b => { const h = INICIO[b.id] && PAGINA_DE[b.id] === i ? INICIO[b.id] : hueco(b, i); if (h) [b.x, b.y] = h; });
  });
  bloques.forEach(b => {
    Object.assign(b.el.style, { width: b.cubo.w * celda + "px", height: b.cubo.h * celda + "px" });
    colocar(b);
  });
  pintarPaginas();
  requestAnimationFrame(() => tablero.classList.add("listo"));
}

// Elementos que se usan con normalidad y nunca arrastran el cubo
const QUIETO = "input, textarea, button, [data-quieto]";

function montarBloque(b) {
  const el = document.createElement("div");
  el.className = "bloque";
  const cara = document.createElement("div");
  cara.className = "cara";
  el.appendChild(cara);
  paginasEl[b.pag].appendChild(el);
  b.el = el; b.cara = cara;
  prepararCara(b);
  b.cubo.montar?.(cara);
  b.cubo.pintar?.(cara);

  el.addEventListener("pointerdown", e => {
    if (b.arr || e.button > 0 || pag.arr || Math.abs(pag.p - pag.objetivo) > .05) return;
    e.stopPropagation();
    const enControl = !!e.target.closest(QUIETO);
    if (!enControl) { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch {} }
    deslizando.delete(b); b.desliz = null;
    const a = b.arr = { id: e.pointerId, enControl, fx0: e.clientX, fy0: e.clientY, fx: e.clientX, fy: e.clientY,
              g: { x: b.x * celda, y: b.y * celda }, eje: null, movido: false, largo: false, v: 0, tUlt: performance.now() };
    // Mantener pulsado sin mover: siguiente skin
    if (!enControl) a.reloj = setTimeout(() => {
      if (b.arr !== a || a.movido) return;
      a.largo = true;
      siguienteDiseno(b);
      rehacer(b, true);
    }, 430);
  });
}
bloques.forEach(montarBloque);

// Primer hueco libre (en casillas enteras) donde quepa el cubo en una página
function hueco(b, pagina) {
  const prueba = { ...b, pag: pagina, x: -99, y: -99 };
  for (let y = 0; y + b.cubo.h <= FILAS; y++)
    for (let x = 0; x + b.cubo.w <= COLS; x++) if (libre(prueba, x, y)) return [x, y];
  return null;
}

// Añade un bloque recién conseguido: busca hueco (primero en la página que ves), va a esa
// página si hace falta y lo hace entrar con su animación. Devuelve false si no cabe en ninguna.
function anadirBloque(id) {
  const cubo = CUBOS[id], actual = Math.round(pag.p);
  const orden = [actual, ...PAGINAS.map((_, i) => i).filter(i => i !== actual)];
  let sitio = null, pagina = 0;
  for (const p of orden) { sitio = hueco({ id, cubo }, p); if (sitio) { pagina = p; break; } }
  if (!sitio) return false;
  const b = { id, cubo, x: sitio[0], y: sitio[1], pag: pagina };
  bloques.push(b);
  montarBloque(b);
  Object.assign(b.el.style, { width: cubo.w * celda + "px", height: cubo.h * celda + "px" });
  b.el.style.visibility = "hidden";
  colocar(b);
  guardar("propios", bloques.map(o => o.id));
  guardar("paginaDe", Object.fromEntries(bloques.map(o => [o.id, o.pag])));
  guardarPosiciones();
  const espera = pagina !== actual ? (irAPagina(pagina), 520) : 0;
  setTimeout(() => { b.el.style.visibility = ""; entradaNueva(b); }, espera);
  return true;
}

function entradaNueva(b) {
  const pagEl = paginasEl[b.pag], c = celda, m = 4.5;
  const x = b.x * c + m, y = b.y * c + m, w = b.cubo.w * c - 2 * m, h = b.cubo.h * c - 2 * m;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "silueta");
  Object.assign(svg.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  svg.innerHTML = `<rect x=".7" y=".7" width="${w - 1.4}" height="${h - 1.4}" rx="13"/>`;
  const halo = document.createElement("div");
  halo.className = "halo";
  Object.assign(halo.style, { left: x - 30 + "px", top: y - 30 + "px", width: w + 60 + "px", height: h + 60 + "px" });
  pagEl.prepend(svg, halo);
  const brillo = document.createElement("span"); brillo.className = "destello";
  b.cara.appendChild(brillo);
  animar(b.cara, "nace");
  // Los vecinos de la misma página se apartan un instante, alejándose del nuevo
  const cx = b.x + b.cubo.w / 2, cy = b.y + b.cubo.h / 2;
  bloques.filter(o => o !== b && o.pag === b.pag).forEach(o => {
    const dx = o.x + o.cubo.w / 2 - cx, dy = o.y + o.cubo.h / 2 - cy, d = Math.hypot(dx, dy) || 1;
    const fuerza = Math.max(0, 5 - d * 1.2);
    if (fuerza <= 0) return;
    o.cara.style.setProperty("--ax", (dx / d * fuerza).toFixed(1) + "px");
    o.cara.style.setProperty("--ay", (dy / d * fuerza).toFixed(1) + "px");
    animar(o.cara, "aparta");
  });
  sonar("nuevo");
  try { navigator.vibrate?.([8, 60, 14]); } catch {}
  setTimeout(() => { svg.remove(); halo.remove(); brillo.remove(); b.cara.classList.remove("nace"); }, 2000);
}

// ── Tienda ──────────────────────────────────────────────────
const CATALOGO = {
  bloques: [
    { id: "contador", nombre: "Contador", texto: "Toca para sumar uno.", precio: 15, muestra: "7" },
    { id: "dado", nombre: "Dado", texto: "Para decidir sin pensar.", precio: 20, muestra: "⚄" },
    { id: "habitos", nombre: "Hábito", texto: "Marca cada día de la semana.", precio: 35, muestra: "3/7" },
    { id: "respira", nombre: "Respira", texto: "Una burbuja que marca el ritmo.", precio: 40, muestra: "◯" },
  ],
  materiales: [
    { n: "terrazo", nombre: "Terrazo", texto: "Piedra con motas de color.", precio: 25 },
    { n: "madera", nombre: "Nogal", texto: "Madera con veta, cálida.", precio: 30 },
    { n: "neón", nombre: "Neón", texto: "Rosa eléctrico de noche.", precio: 35 },
    { n: "holo", nombre: "Holo", texto: "Iridiscente, como una pegatina.", precio: 50 },
  ],
};
const tienda = document.getElementById("tienda"), productos = document.getElementById("productos");
const interruptor = document.getElementById("interruptor");
let pestana = "bloques";

function pintarTienda() {
  document.getElementById("saldo").textContent = `★ ${leer("estrellas", 60)}`;
  tienda.querySelectorAll(".pestanas button").forEach(b => b.classList.toggle("on", b.dataset.tab === pestana));
  const propios = leer("propios", Object.keys(INICIO)), mats = materialesPropios();
  productos.innerHTML = CATALOGO[pestana].map((p, i) => {
    const esBloque = pestana === "bloques", tuyo = esBloque ? propios.includes(p.id) : mats.includes(p.n);
    const fondo = esBloque ? `var(--${CUBOS[p.id].color})` : MATERIALES[p.n], tinta = esBloque ? `var(--t-${CUBOS[p.id].color})` : (p.n === "neón" ? "#ff7ad9" : p.n === "madera" ? "#fbf3e6" : "#1c1c1b");
    return `<div class="producto ${tuyo ? "tuyo" : ""}" data-i="${i}" style="--i:${i}">
      <div class="muestra" style="--m:${fondo};--mt:${tinta}">${esBloque ? p.muestra : "Aa"}</div>
      <b>${p.nombre}</b><p>${p.texto}</p>
      <div class="precio">${esBloque ? "BLOQUE" : "MATERIAL"}<em>${tuyo ? (esBloque ? "EN USO" : "TUYO") : "★ " + p.precio}</em></div>
    </div>`;
  }).join("");
}
function abrirTienda() {
  if (tienda.classList.contains("abierta")) return;
  pintarTienda();
  tienda.classList.add("abierta"); tienda.setAttribute("aria-hidden", "false");
  ponerInterruptor(true);
}
function cerrarTienda() {
  tienda.classList.remove("abierta"); tienda.setAttribute("aria-hidden", "true");
  ponerInterruptor(false);
}
tienda.querySelectorAll(".pestanas button").forEach(b => b.addEventListener("click", () => { pestana = b.dataset.tab; pintarTienda(); sonar("tecla"); }));
document.getElementById("cerrarTienda").addEventListener("click", () => { cerrarTienda(); sonar("interruptor"); });
productos.addEventListener("click", e => {
  const card = e.target.closest(".producto"); if (!card) return;
  const p = CATALOGO[pestana][+card.dataset.i], estrellas = leer("estrellas", 60);
  if (card.classList.contains("tuyo")) { animar(card, "brilla"); sonar("clic"); return; }
  if (estrellas < p.precio) { animar(card, "no"); sonar("muelle"); return; }
  if (pestana === "bloques") {
    if (!hueco({ id: p.id, cubo: CUBOS[p.id] }, Math.round(pag.p)) && !PAGINAS.some((_, i) => hueco({ id: p.id, cubo: CUBOS[p.id] }, i))) { animar(card, "no"); sonar("muelle"); return; }
    guardar("estrellas", estrellas - p.precio);
    sonar("compra");
    cerrarTienda();
    setTimeout(() => anadirBloque(p.id), 450);
  } else {
    guardar("estrellas", estrellas - p.precio);
    guardar("materiales", [...materialesPropios(), p.n]);
    sonar("compra");
    pintarTienda();
    const nueva = productos.querySelector(`.producto[data-i="${card.dataset.i}"]`);
    nueva.style.animation = "none"; nueva.style.opacity = 1; nueva.style.transform = "none";
    animar(nueva, "brilla");
  }
});

// Interruptor: se desliza con el dedo (o se toca) y abre o cierra la tienda
const RECORRIDO = 28;   // px que viaja el mando
function ponerInterruptor(on) {
  interruptor.classList.toggle("on", on);
  interruptor.style.setProperty("--mx", on ? RECORRIDO + "px" : "0px");
}
interruptor.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  try { interruptor.setPointerCapture(e.pointerId); } catch {}
  const x0 = e.clientX, inicio = interruptor.classList.contains("on") ? RECORRIDO : 0;
  let movido = false;
  interruptor.classList.add("arrastra");
  const mover = ev => {
    const dx = ev.clientX - x0; if (Math.abs(dx) > 3) movido = true;
    interruptor.style.setProperty("--mx", Math.max(0, Math.min(RECORRIDO, inicio + dx)) + "px");
  };
  const fin = ev => {
    interruptor.removeEventListener("pointermove", mover);
    interruptor.removeEventListener("pointerup", fin);
    interruptor.removeEventListener("pointercancel", fin);
    interruptor.classList.remove("arrastra");
    const pos = parseFloat(interruptor.style.getPropertyValue("--mx")) || 0;
    const on = movido ? pos > RECORRIDO / 2 : !interruptor.classList.contains("on");
    sonar("interruptor"); try { navigator.vibrate?.(10); } catch {}
    on ? abrirTienda() : cerrarTienda();
    ponerInterruptor(on);
  };
  interruptor.addEventListener("pointermove", mover);
  interruptor.addEventListener("pointerup", fin);
  interruptor.addEventListener("pointercancel", fin);
});
interruptor.addEventListener("click", e => e.stopPropagation());

// Movimiento y fin del dedo, escuchados en todo el documento: aunque el dedo salga del cubo
// o el navegador pierda la captura, el cubo siempre se suelta (nunca se queda pillado)
document.addEventListener("pointermove", e => {
  for (const b of bloques) if (b.arr && b.arr.id === e.pointerId) { b.arr.fx = e.clientX; b.arr.fy = e.clientY; b.arr.tUlt = performance.now(); }
  if (pag.arr && pag.arr.id === e.pointerId) { pag.arr.fx = e.clientX; pag.arr.fy = e.clientY; pag.arr.tUlt = performance.now(); }
}, { passive: true });
function finDedo(e) {
  for (const b of bloques) if (b.arr && b.arr.id === e.pointerId) soltarCubo(b, e);
  if (pag.arr && pag.arr.id === e.pointerId) soltarPagina(e);
}
["pointerup", "pointercancel"].forEach(n => document.addEventListener(n, finDedo));
window.addEventListener("blur", () => bloques.forEach(b => b.arr && soltarCubo(b, { type: "cancel" })));
document.addEventListener("gesturestart", e => e.preventDefault());   // sin zoom con dos dedos en iPhone

// Hueco vacío de la bandeja: deslizar en horizontal pasa de página; tocar cambia el fondo
tablero.addEventListener("pointerdown", e => {
  if (e.button > 0 || pag.arr) return;
  e.preventDefault();
  try { tablero.setPointerCapture(e.pointerId); } catch {}
  pag.arr = { id: e.pointerId, fx0: e.clientX, fy0: e.clientY, fx: e.clientX, fy: e.clientY, p0: pag.p, activo: false, tUlt: performance.now() };
  pag.v = 0;
});
function soltarPagina(e) {
  const a = pag.arr; pag.arr = null;
  if (a.activo) {
    // Basta un gesto rápido hacia un lado, o pasar de la mitad
    const v = performance.now() - a.tUlt > 80 ? 0 : pag.v;
    const n = Math.abs(v) > .9 ? (v > 0 ? Math.floor(pag.p) + 1 : Math.ceil(pag.p) - 1) : Math.round(pag.p);
    irAPagina(n, v);
    return;
  }
  const dx = a.fx - a.fx0, dy = a.fy - a.fy0;
  if (e.type === "pointerup" && Math.hypot(dx, dy) < 8) cambiarFondo(e.clientX, e.clientY);
}

function cambiarFondo(x, y, inicial) {
  const clave = "fondo." + familia().n, actual = leer(clave, Math.max(0, FONDOS.indexOf(familia().fondo)));
  const n = inicial ? actual : (actual + 1) % FONDOS.length;
  guardar(clave, n);
  if (inicial || matchMedia("(prefers-reduced-motion: reduce)").matches) { bandeja.dataset.fondo = FONDOS[n]; return; }
  const r = bandeja.getBoundingClientRect(), onda = document.createElement("div");
  onda.className = "onda"; onda.dataset.fondo = FONDOS[n];
  onda.style.setProperty("--ox", x - r.left + "px"); onda.style.setProperty("--oy", y - r.top + "px");
  bandeja.prepend(onda);
  sonar("barrido");
  // Al terminar la onda se fija el fondo; el temporizador es por si la animación no llega a acabar
  const fijar = () => { bandeja.dataset.fondo = FONDOS[n]; onda.remove(); };
  onda.addEventListener("animationend", fijar, { once: true });
  setTimeout(fijar, 750);
}
cambiarFondo(0, 0, true);

function tic() {
  bloques.forEach(b => b.cubo.cadaSegundo && b.cubo.pintar(b.cara, true));
}
setInterval(tic, 1000);
const reloj = bloques.find(b => b.id === "reloj");
(function fotograma() {
  // Solo se anima el reloj si está en la página que se ve (o pasando por ella) y la app está delante
  if (reloj && document.visibilityState === "visible" && Math.abs(reloj.pag - pag.p) < 1) reloj.cubo.barrer(reloj.cara);
  requestAnimationFrame(fotograma);
})();
tic();
medir();
// Entrada escalonada de la página visible, de arriba abajo
[...bloques].filter(b => b.pag === Math.round(pag.p)).sort((a, b) => a.y - b.y || a.x - b.x).forEach((b, i) => {
  b.el.style.setProperty("--retardo", 80 + i * 70 + "ms");
  b.el.classList.add("entra");
  b.cara.addEventListener("animationend", e => e.animationName === "entra" && b.el.classList.remove("entra"));
});
// Se vuelve a medir siempre que el objeto cambie de tamaño (girar, abrir la app, ventana)
if (window.ResizeObserver) new ResizeObserver(() => medir()).observe(document.getElementById("objeto"));
else window.addEventListener("resize", medir);
// Actualizaciones: al registrar, y cada vez que la app vuelve a primer plano (el iPhone la
// deja dormida en memoria y no recarga), se pregunta si hay versión nueva. Si la hay, el
// service worker nuevo toma el control y la página se recarga una vez, sola.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    const comprobar = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && comprobar());
    setInterval(comprobar, 30 * 60 * 1000);
  });
  let recargando = false;
  const habiaControl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!habiaControl || recargando) return;   // la primera instalación no necesita recargar
    recargando = true;
    location.reload();
  });
}
document.fonts?.ready.then(medir);
</script>
